<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AnimalCare</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; margin: 2rem; }
      .container { max-width: 800px; margin: 0 auto; }
      .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
      .row { display: flex; gap: 12px; align-items: center; }
      textarea { width: 100%; height: 260px; padding: 12px; border-radius: 8px; border: 1px solid #d1d5db; }
      button { background: #2563eb; color: white; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
      button[disabled] { background: #9ca3af; cursor: not-allowed; }
      .muted { color: #6b7280; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>AnimalCare – Behavior Report</h1>
      <p class="muted">Upload a short animal video. We extract frames and generate a behavior and health narrative.</p>
      <div class="card">
        <div class="row">
          <input id="file" type="file" accept="video/*" />
          <button id="submit">Analyze</button>
        </div>
        <p id="status" class="muted" style="margin-top: 8px;"></p>
        <textarea id="output" placeholder="Report will appear here..." readonly></textarea>
      </div>
    </div>
    <script>
      const fileInput = document.getElementById('file');
      const submitBtn = document.getElementById('submit');
      const output = document.getElementById('output');
      const status = document.getElementById('status');

      submitBtn.addEventListener('click', async () => {
        if (!fileInput.files.length) {
          alert('Please choose a video file.');
          return;
        }
        const formData = new FormData();
        formData.append('video', fileInput.files[0]);
        submitBtn.disabled = true;
        status.textContent = 'Uploading and analyzing... this can take up to a minute for longer videos.';
        output.value = '';
        try {
          const res = await fetch('/api/analyze', { method: 'POST', body: formData });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || ('Request failed with ' + res.status));
          }
          const data = await res.json();
          output.value = data.report || '';
          status.textContent = 'Done.';
        } catch (e) {
          status.textContent = 'Error: ' + e.message;
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
  </html>
